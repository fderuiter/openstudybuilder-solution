name: CI Workflow

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Prebuild validations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install pipenv and pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pipenv pip-audit

      - name: Run Dependency Security Audit
        run: |
          chmod +x ./clinical-mdr-api/pipelines/scripts/dependency_audit.py
          ./clinical-mdr-api/pipelines/scripts/dependency_audit.py

      - name: Install clinical-mdr-api dependencies
        run: |
          cd clinical-mdr-api
          pipenv --python 3.12
          pipenv install --dev

      - name: Verify Backend OpenAPI Schema Drift
        run: |
          cd clinical-mdr-api
          cp openapi.json openapi.json.bak
          cp apiVersion apiVersion.bak
          NEO4J_DSN=bolt://localhost:7687 pipenv run python generate_openapi_json.py
          diff -u openapi.json.bak openapi.json
          diff -u apiVersion.bak apiVersion

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: studybuilder/yarn.lock

      - name: Run StudyBuilder Static Accessibility Lint
        run: |
          cd studybuilder
          yarn install
          yarn lint

      - name: Generate Frontend Types from OpenAPI spec
        run: |
          cd studybuilder
          npx openapi-typescript ../clinical-mdr-api/openapi.json -o ./src/api/api.d.ts

      - name: Verify Frontend JSDoc Type Contracts
        run: |
          cd studybuilder
          npx tsc --noEmit -p jsconfig.json

  build:
    name: Build and Health Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build docker containers
        run: |
          docker version
          docker compose version

          docker compose build

      - name: Run Trivy scanner for Database image
        uses: aquasecurity/trivy-action@v0.28.0
        continue-on-error: true
        with:
          image-ref: 'app-database:latest'
          format: 'sarif'
          output: 'trivy-database.sarif'
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy database scan results
        uses: github/code-scanning-upload-sarif@v2
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-database.sarif'
          category: 'database'

      - name: Run Trivy scanner for API image
        uses: aquasecurity/trivy-action@v0.28.0
        continue-on-error: true
        with:
          image-ref: 'app-api:latest'
          format: 'sarif'
          output: 'trivy-api.sarif'
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy api scan results
        uses: github/code-scanning-upload-sarif@v2
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-api.sarif'
          category: 'api'

      - name: Run Trivy scanner for Consumer API image
        uses: aquasecurity/trivy-action@v0.28.0
        continue-on-error: true
        with:
          image-ref: 'app-consumerapi:latest'
          format: 'sarif'
          output: 'trivy-consumerapi.sarif'
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy consumerapi scan results
        uses: github/code-scanning-upload-sarif@v2
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-consumerapi.sarif'
          category: 'consumerapi'

      - name: Run Trivy scanner for Extensions API image
        uses: aquasecurity/trivy-action@v0.28.0
        continue-on-error: true
        with:
          image-ref: 'app-extensionsapi:latest'
          format: 'sarif'
          output: 'trivy-extensionsapi.sarif'
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy extensionsapi scan results
        uses: github/code-scanning-upload-sarif@v2
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-extensionsapi.sarif'
          category: 'extensionsapi'

      - name: Run Trivy scanner for Frontend image
        uses: aquasecurity/trivy-action@v0.28.0
        continue-on-error: true
        with:
          image-ref: 'app-frontend:latest'
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy frontend scan results
        uses: github/code-scanning-upload-sarif@v2
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-frontend.sarif'
          category: 'frontend'

      - name: Run Trivy scanner for Documentation image
        uses: aquasecurity/trivy-action@v0.28.0
        continue-on-error: true
        with:
          image-ref: 'app-documentation:latest'
          format: 'sarif'
          output: 'trivy-documentation.sarif'
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy documentation scan results
        uses: github/code-scanning-upload-sarif@v2
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-documentation.sarif'
          category: 'documentation'

      - name: Run Trivy scanner for Neodash image
        uses: aquasecurity/trivy-action@v0.28.0
        continue-on-error: true
        with:
          image-ref: 'app-neodash:latest'
          format: 'sarif'
          output: 'trivy-neodash.sarif'
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy neodash scan results
        uses: github/code-scanning-upload-sarif@v2
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-neodash.sarif'
          category: 'neodash'
          
      - name: Validate docker containers
        run: |
          docker compose up -d
          sleep 4m
          docker container ls
          if [ $(docker ps --filter "label=com.docker.compose.project" -f 'health=none' -f 'health=starting' -f 'health=unhealthy' -q | wc -l) -gt 0 ]; then export CONTAINERSTATUS=unhealthy; else export CONTAINERSTATUS=healthy; fi
          docker compose down
          if [ "$CONTAINERSTATUS" == "unhealthy" ]; then exit 1; else echo $CONTAINERSTATUS; fi
