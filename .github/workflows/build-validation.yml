name: CI Workflow

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Prebuild validations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install pipenv and pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pipenv pip-audit

      - name: Run Dependency Security Audit
        run: |
          chmod +x ./clinical-mdr-api/pipelines/scripts/dependency_audit.py
          ./clinical-mdr-api/pipelines/scripts/dependency_audit.py

  build:
    name: Build and Health Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build docker containers
        run: |
          docker version
          docker compose version

          docker compose build
          
      - name: Validate docker containers
        run: |
          docker compose up -d
          sleep 4m
          docker container ls
          if [ $(docker ps -f 'health=none' -f 'health=starting' -f 'health=unhealthy' -q | wc -l) -gt 0 ]; then export CONTAINERSTATUS=unhealthy; else export CONTAINERSTATUS=healthy; fi
          docker compose down
          if [ "$CONTAINERSTATUS" == "unhealthy" ]; then exit 1; else echo $CONTAINERSTATUS; fi
