name: CI Workflow

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Prebuild validations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Prebuild validations
        run: echo "Secret detections and other prebuild validation would be executed here (customize as needed)."

  build:
    name: Build and Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build docker containers
        run: |
          docker version
          docker compose version

          docker compose build
          
      - name: Start docker containers
        run: |
          docker compose up -d

      - name: Dynamic wait for container health
        run: |
          echo "Waiting for services to start up..."
          # Loop up to 30 times (150 seconds max)
          for i in {1..30}; do
            # Check if any container is still in "starting" state
            if docker ps --format '{{.Names}}: {{.Status}}' | grep -q "starting"; then
              echo "Some containers are still starting..."
              docker ps --format '{{.Names}}: {{.Status}}' | grep "starting"
              sleep 5
            else
              echo "No containers are starting anymore!"
              break
            fi
          done
          # Display final container list and statuses
          docker ps -a
          
          # Check health status
          if [ $(docker ps -f 'health=unhealthy' -q | wc -l) -gt 0 ]; then
            echo "Some containers are unhealthy!"
            docker ps -a --filter "health=unhealthy"
            exit 1
          else
            echo "All containers are healthy/running!"
          fi

      - name: Run live Schemathesis contract tests
        run: |
          docker compose exec -T \
            -e SCHEMATHESIS_STUDY_UID=Study_000006 \
            -e SCHEMATHESIS_HOOKS=clinical_mdr_api.hooks.schemathesis_hooks \
            api pipenv run schemathesis run \
              --experimental=openapi-3.1 \
              --checks=all \
              --base-url=http://localhost:5003/api \
              --request-timeout=200000 \
              --hypothesis-max-examples=10 \
              --hypothesis-verbosity=normal \
              --hypothesis-deadline=None \
              --hypothesis-suppress-health-check=too_slow,filter_too_much,data_too_large \
              --workers=auto \
              --junit-xml=reports/schemathesis_report.xml \
              --report=reports/schemathesis_report.tgz \
              --show-trace \
              openapi.json

      - name: Retrieve Schemathesis reports from container
        if: always()
        run: |
          mkdir -p reports
          docker compose cp api:/app/reports/schemathesis_report.xml ./reports/schemathesis_report.xml || true
          docker compose cp api:/app/reports/schemathesis_report.tgz ./reports/schemathesis_report.tgz || true

      - name: Upload Schemathesis report artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schemathesis-reports
          path: reports/

      - name: Stop docker containers
        run: |
          docker compose down
        if: always()
