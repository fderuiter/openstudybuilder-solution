name: CI Workflow

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Prebuild validations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install pipenv and pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pipenv pip-audit

      - name: Run Dependency Security Audit
        run: |
          chmod +x ./clinical-mdr-api/pipelines/scripts/dependency_audit.py
          ./clinical-mdr-api/pipelines/scripts/dependency_audit.py

      - name: Install clinical-mdr-api dependencies
        run: |
          cd clinical-mdr-api
          pipenv --python 3.12
          pipenv install --dev

      - name: Run Backend Unit Tests
        env:
          NEO4J_DSN: bolt://localhost:7687
        run: |
          cd clinical-mdr-api
          pipenv run testunit

      - name: Verify Backend OpenAPI Schema Drift
        run: |
          cd clinical-mdr-api
          cp openapi.json openapi.json.bak
          cp apiVersion apiVersion.bak
          NEO4J_DSN=bolt://localhost:7687 pipenv run python generate_openapi_json.py
          diff -u openapi.json.bak openapi.json
          diff -u apiVersion.bak apiVersion

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: studybuilder/yarn.lock

      - name: Run StudyBuilder Static Accessibility Lint
        run: |
          cd studybuilder
          yarn install
          yarn lint

      - name: Generate Frontend Types from OpenAPI spec
        run: |
          cd studybuilder
          npx openapi-typescript ../clinical-mdr-api/openapi.json -o ./src/api/api.d.ts

      - name: Verify Frontend JSDoc Type Contracts
        run: |
          cd studybuilder
          npx tsc --noEmit -p jsconfig.json

      - name: Generate GxP Compliance Report
        run: |
          python ./clinical-mdr-api/pipelines/scripts/generate_gxp_report.py

      - name: Upload GxP Compliance Reports
        uses: actions/upload-artifact@v4
        with:
          name: gxp-compliance-reports
          path: |
            clinical-mdr-api/reports/gxp-compliance-report.md
            db-schema-migration/reports/gxp-migration-report.md

  build:
    name: Build and Health Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Build docker containers
        run: |
          docker version
          docker compose version
          docker compose build

      - name: Start application services
        run: |
          docker compose up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for all services to become healthy..."
          timeout=300
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            # Count unhealthy or starting containers
            unhealthy_count=$(docker ps --filter "label=com.docker.compose.project" --filter "status=running" -q | xargs -r docker inspect --format='{{json .State.Health.Status}}' | grep -v '"healthy"' | wc -l)
            running_count=$(docker ps --filter "label=com.docker.compose.project" --filter "status=running" -q | wc -l)
            total_count=$(docker ps --filter "label=com.docker.compose.project" -a -q | wc -l)
            
            if [ "$unhealthy_count" -eq 0 ] && [ "$running_count" -eq "$total_count" ] && [ "$total_count" -gt 0 ]; then
              echo "All services are healthy!"
              break
            fi
            echo "Waiting for services... ($elapsed s elapsed, running: $running_count/$total_count, non-healthy: $unhealthy_count)"
            sleep 10
            elapsed=$((elapsed + 10))
          done
          
          # Print status and exit if not healthy
          if [ "$unhealthy_count" -ne 0 ] || [ "$running_count" -ne "$total_count" ]; then
            echo "Error: Services did not become healthy in time."
            docker ps -a
            docker compose logs
            exit 1
          fi

      - name: Set up Python for Database Validation
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Pipenv
        run: |
          python -m pip install --upgrade pip
          pip install pipenv

      - name: Create Symbolic Links for Package Imports
        run: |
          ln -s ${{ github.workspace }}/clinical-mdr-api ${{ github.workspace }}/clinical_mdr_api
          ln -s ${{ github.workspace }}/mdr-standards-import ${{ github.workspace }}/mdr_standards_import
          ln -s ${{ github.workspace }}/studybuilder-import ${{ github.workspace }}/studybuilder_import
          ln -s ${{ github.workspace }}/neo4j-mdr-db ${{ github.workspace }}/neo4j_mdr_db
          ln -s ${{ github.workspace }}/mdr-standards-import/mdr_standards_import/scripts ${{ github.workspace }}/mdr-standards-import/scripts

      - name: Run Database Initialization
        env:
          NEO4J_MDR_HOST: localhost
          NEO4J_MDR_BOLT_PORT: 5002
          NEO4J_MDR_AUTH_USER: neo4j
          NEO4J_MDR_AUTH_PASSWORD: changeme1234
          NEO4J_MDR_DATABASE: mdrdb
          NEO4J_MDR_CLEAR_DATABASE: "false"
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/clinical-mdr-api
        run: |
          cd neo4j-mdr-db
          pipenv sync
          pipenv run python init_neo4j.py

      - name: Run Sequential Database Migrations and Corrections
        env:
          DATABASE_URL: bolt://neo4j:changeme1234@localhost:5002
          DATABASE_NAME: mdrdb
          API_BASE_URL: http://localhost:5005/api
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/clinical-mdr-api
        run: |
          cd db-schema-migration
          pipenv sync --dev
          pipenv run python run_sequential.py

      - name: Run Compliance Integration Tests
        run: |
          docker compose exec -T api pipenv run testint

      - name: Run Backend Authorization Tests
        run: |
          docker compose exec -T api pipenv run testauth

      - name: Run Backend Telemetry Tests
        run: |
          docker compose exec -T api pipenv run test-telemetry

      - name: Build Cypress Container
        run: |
          cd system-tests/ui-tests
          docker compose build cypress

      - name: Run End-to-End Interface Tests
        run: |
          cd system-tests/ui-tests
          docker compose run --rm -e CYPRESS_BASE_URL=http://localhost:5005 -e CYPRESS_API=http://localhost:5005/api cypress yarn run cypress run --headless

      - name: Upload Cypress Screenshots and Videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-artifacts
          path: |
            system-tests/ui-tests/results/screenshots
            system-tests/ui-tests/results/videos

      - name: Run SBOM and Dependency Drift Check
        run: |
          python3 ./clinical-mdr-api/pipelines/scripts/check_sbom_drift.py

      - name: Shut down services
        run: |
          docker compose down
